<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="//uiowa.edu/profiles/custom/sitenow/assets/favicon.ico" />
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCTYZ2ogy4XY8GmiIpiw89OpE9iRk5MnxM"></script>
    <title>MRMS Browser</title>
  </head>
  <body>
      <div id="map"></div>

      <div id="menu-container">
          <div id="timeline-container">
              <svg id="start-marker" viewBox='0 0 1 1'><polygon points='0,0 1,0 0.5,1' fill='green'/></svg>
              <svg id="stop-marker" viewBox='0 0 1 1'><polygon points='0,0 1,0 0.5,1' fill='red'/></svg>
              <div id="line"></div>
              <div id="timeline"></div>
          </div>
      </div>

      <div id="player-container">
          <div class="player-controls-group">
              <span class="player-btn" id="step-backward" aria-label="Step Backward">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polygon points="19 20 9 12 19 4 19 20"></polygon>
                      <line x1="5" y1="19" x2="5" y2="5"></line>
                  </svg>
              </span>

              <span class="player-btn" id="play-pause-btn" aria-label="Play">
                  <svg viewBox="0 0 24 24" stroke="none">
                      <polygon points="5 3 19 12 5 21 5 3"></polygon>
                  </svg>
              </span>

              <span class="player-btn" id="step-forward" aria-label="Step Forward">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polygon points="5 4 15 12 5 20 5 4"></polygon>
                      <line x1="19" y1="5" x2="19" y2="19"></line>
                  </svg>
              </span>
          </div>

          <input id="player-seek" type="range" value="0" min="0" max="0">
      </div>


      <div id="sidebar">
          <span class="sidebar-item" data-menu="product-selector">Select Product</span>
          <span class="sidebar-item" data-menu="database-manager">Database Manager</span>
          <span class="sidebar-item" data-menu="map-layers">Map Layers</span>
          <span class="sidebar-item" data-menu="settings">Settings</span>
      </div>

      <div id="menus">
          <div id="product-selector" class="hidden">
              <div class="menu-header">
                  <h2>Products</h2>
                  <p>Browse and select MRMS products.</p>
              </div>
              <div id="product-menu-container" class="layers-list"></div>
          </div>

          <div id="database-manager" class="hidden">
              <div class="dt-controls">
                <button id="play-files-btn" class="btn success">Play</button>
                <button id="select-all-btn" class="btn primary">Select All</button>
                <button id="delete-btn" class="btn danger">Delete</button>
                <span class="dt-storage-info">
                    <span><b>Storage:</b></span>
                    <span id="total-storage"></span>
                    <span id="selected-storage"></span>
                </span>
              </div>
              <table id="datatable"></table>
          </div>

          <div id="map-layers" class="hidden">
              <div class="menu-header">
                  <h2>Map Layers</h2>
                  <p>Manage the visibility and style of each layer.</p>
              </div>

              <ul class="layers-list">
                  <li class="layer-item" data-layer="nexrad">
                      <div class="layer-header" onclick="toggleLayer(this)">
                          <div class="header-left">
                              <svg class="chevron" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
                              <span class="layer-label">NEXRAD Radars</span>
                          </div>
                          <label class="toggle-switch">
                              <input type="checkbox">
                              <span class="slider"></span>
                          </label>
                      </div>

                      <div class="layer-controls">
                          <div class="controls-grid">
                              <div class="control-group">
                                  <label>Color:</label>
                                  <div class="color-wrapper">
                                      <input type="color" value="#ef4444">
                                  </div>
                              </div>
                              <div class="control-group">
                                  <label>Size:</label>
                                  <input type="number" value="2.0" min="2.0" max="4.5" step="0.5" inputmode="decimal">
                              </div>
                          </div>
                      </div>
                  </li>

                  <li class="layer-item" data-layer="usgs">
                      <div class="layer-header" onclick="toggleLayer(this)">
                          <div class="header-left">
                              <svg class="chevron" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
                              <span class="layer-label">USGS Gauges</span>
                          </div>
                          <label class="toggle-switch">
                              <input type="checkbox">
                              <span class="slider"></span>
                          </label>
                      </div>

                      <div class="layer-controls">
                          <div class="controls-grid">
                              <div class="control-group">
                                  <label>Color:</label>
                                  <div class="color-wrapper">
                                      <input type="color" value="#ef4444">
                                  </div>
                              </div>
                              <div class="control-group">
                                  <label>Size:</label>
                                  <input type="number" value="2.0" min="2.0" max="4.5" step="0.5" inputmode="decimal">
                              </div>
                          </div>
                      </div>
                  </li>

                  <li class="layer-item" data-layer="river-network">
                      <div class="layer-header" onclick="toggleLayer(this)">
                          <div class="header-left">
                              <svg class="chevron" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
                              <span class="layer-label">River Network</span>
                          </div>
                          <label class="toggle-switch">
                              <input type="checkbox">
                              <span class="slider"></span>
                          </label>
                      </div>

                      <div class="layer-controls">
                          <div class="controls-grid">
                              <div class="control-group">
                                  <label>Color:</label>
                                  <div class="color-wrapper">
                                      <input type="color" value="#46bcec">
                                  </div>
                              </div>
                              <div class="control-group">
                                  <label>Size:</label>
                                  <input type="number" value="1.0" min="0.5" max="4.5" step="0.5" inputmode="decimal">
                              </div>
                              <div class="control-group" style="grid-column: span 2">
                                  <div style="display:flex; justify-content: space-between;">
                                      <label>Opacity</label>
                                      <label id="river-network-opacity-label" style="color: var(--text-color); font-weight: 400;">100%</label>
                                  </div>
                                  <input type="range" min="0" max="100" value="100" class="range-slider">
                              </div>
                          </div>
                      </div>
                  </li>

                  <li class="layer-item" data-layer="terrain">
                      <div class="layer-header" onclick="toggleLayer(this)">
                          <div class="header-left">
                              <svg class="chevron" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"></path></svg>
                              <span class="layer-label">Terrain Layer</span>
                          </div>
                          <label class="toggle-switch">
                              <input type="checkbox">
                              <span class="slider"></span>
                          </label>
                      </div>

                      <div class="layer-controls">
                          <div class="controls-grid">
                              <div class="control-group" style="grid-column: span 2">
                                  <div style="display:flex; justify-content: space-between;">
                                      <label>Opacity</label>
                                      <label id="terrain-opacity-label" style="color: var(--text-color); font-weight: 400;">100%</label>
                                  </div>
                                  <input type="range" min="0" max="100" value="100" class="range-slider">
                              </div>
                          </div>
                      </div>
                  </li>
              </ul>
          </div>

          <div id="settings" class="hidden">
              This is the settings menu.
          </div>
      </div>
  </body>
  <script type="module" src="/src/main.js"></script>
</html>
